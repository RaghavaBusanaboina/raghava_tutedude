<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List</title>
    <style>
        body { font-family: sans-serif; max-width: 500px; margin: 40px auto; padding: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, textarea { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        button { padding: 10px 15px; background-color: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background-color: #218838; }
    </style>
</head>
<body>
    <h2>Add a New To-Do Item</h2>
    
    <!-- Form posts to the /submittodoitem route -->
    <form action="/submittodoitem" method="POST">
        {% if message %}
            <p style="color: blue; font-weight: bold;">{{ message }}</p>
        {% endif %}
        <div class="form-group">
            <label for="item_name">Item Name:</label>
            <input type="text" id="item_name" name="item_name" placeholder="E.g., Buy groceries" required>
        </div>
        
        <div class="form-group">
            <label for="item_description">Item Description:</label>
            <textarea id="item_description" name="item_description" rows="4" placeholder="E.g., Milk, Eggs, Bread" required></textarea>
        </div>

        <div class="form-group">
            <label for="item_id">Item ID:</label>
            <input type="text" id="item_id" name="item_id" placeholder="E.g., 1" required>
        </div>

        <div class="form-group">
            <label for="item_UUID">Item UUID:</label>
            <input type="text" id="item_UUID" name="item_UUID" required>
        </div>

        <div class="form-group">
            <label for="item_hash">Item HASH:</label>
            <input type="text" id="item_hash" name="item_hash" required>
        </div>

        
        
        <button type="submit">Add Item</button>
    </form>
</body>
</html>
